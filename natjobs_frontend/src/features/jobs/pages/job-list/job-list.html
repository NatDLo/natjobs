<div class="container">
  <h2>Jobs</h2>

  @if (loading) {
    <p>Loading jobs...</p>
  }

  @if (error) {
    <p>{{ error }}</p>
  }

  @if (!loading && !error) {
    @if (!jobs.length) {
      <p>No jobs available yet.</p>
    }

    @for (job of jobs; track job.id) {
      <div class="job-card">
        <div class="job-card-top">
          <h3>{{ job.title }}</h3>
          @if (job.status) {
            <span class="status-pill status-{{ job.status }}">{{ job.status }}</span>
          }
        </div>
        <p>{{ job.description }}</p>

        <button type="button" [routerLink]="['/jobs', job.id]">
          View
        </button>
      </div>
    }
  }
</div>
